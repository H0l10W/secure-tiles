name: Test and publish release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -v

  release:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $content = Get-Content secure_tiles/__init__.py -Raw
          $match = [regex]::Match($content, '__version__\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"')
          if (-not $match.Success) { throw 'Could not read application version' }
          "version=$($match.Groups[1].Value)" >> $env:GITHUB_OUTPUT
      - name: Package source release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item main.py,relay_server.py,requirements.txt,README.md -Destination release
          Copy-Item secure_tiles,assets -Destination release -Recurse
          Compress-Archive -Path release/* -DestinationPath secure-tiles-windows.zip -CompressionLevel Optimal
      - name: Publish versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          if (gh release view $tag 2>$null) {
            Write-Host "$tag already exists; bump secure_tiles/__init__.py for a new release."
          } else {
            gh release create $tag secure-tiles-windows.zip --title "Secure Tiles $tag" --generate-notes --target $env:GITHUB_SHA
          }
